name: MobTag
version: '${project.version}'
main: me.abood8001.mobtag.MobTag
api-version: '1.21'
author: Abood_8001
description: Displays health tags above mobs with full customization.

softdepend:
  - PlaceholderAPI
  - MythicMobs
  - SimplePets
  - packetevents
  - floodgate

commands:
  mobtag:
    description: Open the MobTag settings menu
    usage: /mobtag [toggle <mobs|players|damage|targetbar> | style <id> | size <id> | show <always|looking|combat> | admin <reload|debug>]
    permission: mobtag.use

permissions:
  mobtag.use:
    description: Base permission, required to run /mobtag at all
    default: true
  mobtag.toggle:
    description: Allows opening the settings menu and toggling your own tags
    default: true
  mobtag.admin:
    description: Allows /mobtag admin reload and /mobtag admin debug
    default: op
